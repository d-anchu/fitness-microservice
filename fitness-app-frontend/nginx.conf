# ============================================
# NGINX CONFIGURATION FOR REACT SPA
# ============================================
# This configuration serves the React frontend and proxies API requests

server {
    # Listen on port 80 (HTTP)
    # In production, use 443 with SSL/TLS certificates
    listen 80;
    
    # Server name (localhost for development)
    # In production, replace with your domain: fitness.example.com
    server_name localhost;
    
    # Root directory where React build files are stored
    # Nginx serves index.html, CSS, JS from here
    root /usr/share/nginx/html;
    
    # Default file to serve
    index index.html;

    # ============================================
    # API PROXY CONFIGURATION
    # ============================================
    # Proxies all /api/* requests to the backend API Gateway
    # Example: Frontend calls /api/users/register
    # Nginx forwards to http://api-gateway:8080/users/register
    location /api/ {
        # Remove /api prefix and forward to gateway
        # /api/users → http://api-gateway:8080/users
        proxy_pass http://api-gateway:8080/;
        
        # Preserve original Host header
        proxy_set_header Host $host;
        
        # Forward real client IP address
        # Backend can see actual user IP, not Nginx IP
        proxy_set_header X-Real-IP $remote_addr;
        
        # Forward proxy chain information
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Forward original protocol (http/https)
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for backend requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # SINGLE PAGE APPLICATION (SPA) ROUTING
    # ============================================
    # React Router uses client-side routing
    # URLs like /activities, /profile don't exist as files
    # Nginx serves index.html for all routes, React Router handles navigation
    location / {
        # Try to serve the requested file
        # If not found, try as directory
        # If still not found, serve index.html (SPA fallback)
        try_files $uri $uri/ /index.html;
        
        # Disable caching for index.html (always get latest version)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ============================================
    # STATIC ASSETS CACHING
    # ============================================
    # Cache static files (JS, CSS, images) for performance
    # Files have hash in name (main.abc123.js), safe to cache long-term
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # HEALTH CHECK ENDPOINT
    # ============================================
    # Docker health check calls this endpoint
    # Returns 200 OK if Nginx is running
    location /health {
        access_log off;  # Don't log health checks (reduces log noise)
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # SECURITY HEADERS
    # ============================================
    # Basic security headers for production
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ============================================
    # ERROR HANDLING
    # ============================================
    # Custom error pages (optional)
    # error_page 404 /404.html;
    # error_page 500 502 503 504 /50x.html;
}
