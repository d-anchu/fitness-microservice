spring:
  # `spring.application.name` MUST be declared locally: it is the key the Config
  # Server lookup uses (http://localhost:8888/<name>/default). Without it the
  # service would fetch `application/default`, never load the centralised
  # `ai-service.yml`, and Eureka would register it as UNKNOWN.
  application:
    name: ai-service
  config:
    # Load secrets (GROQ_API_KEY) from a local .env file so the service works
    # from a terminal as well as from the IDE. Spring reads the KEY=value lines
    # as a .properties file. Both paths are optional, which means the app still
    # starts (failing later with a clear placeholder error) if no .env exists.
    #   - .env     -> used when the working directory is the project root
    #   - ../.env  -> used when the working directory is the aiservice folder
    #
    # The Config Server is listed FIRST on purpose: later entries in this list
    # win, so a local .env secret always overrides a centralised default.
    # Central config: configserverc/configserverc/src/main/resources/config/ai-service.yml
    import:
      - optional:configserver:http://localhost:8888
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
