# Bootstrap config for the activity-service.
# `spring.application.name` MUST be declared locally: it is the key the Config
# Server lookup uses (http://localhost:8888/<name>/default). Without it the
# service would fetch `application/default`, never load the centralised
# `activity-service.yml`, and Eureka would register it as UNKNOWN.
#
# Central config: configserverc/configserverc/src/main/resources/config/activity-service.yml
# The values below are fallbacks so the service can still boot if the Config
# Server is not running -- the Config Server value wins whenever both define
# the same key.
spring:
  application:
    name: activity-service
  config:
    import: optional:configserver:http://localhost:8888



